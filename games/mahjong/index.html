<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090423">
<title>Маджонг</title>
<style>
:root{--bg:#050118;--navy:#0b0b51;--navy2:#121469;--cyan:#48dfff;--cyan2:#84f4ff;--pink:#ff4eb7;--violet:#7655ff;--orange:#ff9b42;--text:#fff;--muted:#cfd4ef;--panel:rgba(24,24,108,.90);--panel2:rgba(17,15,74,.95)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02000d;color:var(--text);font-family:var(--font-ui)}button,input{font:inherit}button{border:0;color:inherit;background:none;cursor:pointer}img{display:block;max-width:100%}.u{font-family:var(--font-accent);font-weight:900;letter-spacing:-.045em}
body{display:grid;place-items:center;background:radial-gradient(circle at 12% 20%,rgba(40,140,255,.12),transparent 25%),radial-gradient(circle at 90% 78%,rgba(255,62,187,.11),transparent 28%),#02000d}
#app{position:relative;height:min(100dvh,100vh);aspect-ratio:9/16;max-width:100vw;overflow:hidden;background:linear-gradient(180deg,#161a72 0%,#0a083c 58%,#040119 100%);box-shadow:0 0 70px rgba(0,0,0,.5)}
.starfield{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.7;background-image:radial-gradient(circle at 12% 13%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 82% 22%,#5fe5ff 0 1.2px,transparent 1.8px),radial-gradient(circle at 23% 47%,#ff72c9 0 1.1px,transparent 1.7px),radial-gradient(circle at 69% 71%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 89% 84%,#9e71ff 0 1.1px,transparent 1.7px);background-size:230px 230px,290px 290px,330px 330px,270px 270px,350px 350px}
.screen{position:absolute;inset:0;display:none;z-index:1}.screen.active{display:flex}.scroll{overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
/* splash: preserve approved main screen */
#splash{background:#06031b}.splashPoster{position:absolute;inset:0;background:url('assets/splash.png') center/cover no-repeat}.startHotspot{position:absolute;left:14%;right:14%;bottom:3%;height:12%;opacity:0;border-radius:999px}
/* menu */
#menu{padding:3.4% 4.7% 3%;flex-direction:column;align-items:center;background:linear-gradient(180deg,#19227d,#0a073b 60%,#040118)}
.menuInner{width:100%;max-width:720px;position:relative;z-index:2}.menuLogo{width:66px;height:66px;object-fit:contain;margin:0 auto 7px;filter:drop-shadow(0 0 15px rgba(73,221,255,.35))}.menuTitle{margin:0;text-align:center;font-size:clamp(36px,7.1vw,62px);line-height:.93}.menuSub{margin:9px auto 15px;max-width:94%;text-align:center;color:var(--muted);font-size:clamp(11px,2.25vw,17px);line-height:1.3}
.panel{border-radius:30px;background:linear-gradient(145deg,rgba(54,60,164,.60),rgba(27,21,102,.84));border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 36px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.05)}
.heroPanel{padding:14px}.heroHead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:10px}.heroHead strong{font-size:clamp(19px,4vw,29px);line-height:1}.heroHead span{max-width:42%;text-align:right;color:#d4d7ed;font-size:clamp(9px,1.9vw,13px);line-height:1.2}.heroRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.heroChoice{position:relative;height:82px;padding:9px 10px;display:grid;grid-template-columns:58px 1fr;align-items:center;gap:9px;text-align:left;border-radius:22px;background:linear-gradient(145deg,rgba(49,52,160,.78),rgba(31,23,107,.92));border:1px solid rgba(255,255,255,.10);overflow:hidden}.heroChoice img{width:56px;height:56px;object-fit:contain;border-radius:16px;background:#111052;border:1px solid rgba(255,255,255,.10)}.heroChoice .name{font-size:clamp(13px,2.7vw,19px);line-height:1.03;position:relative;z-index:2}.heroChoice.on{border-color:rgba(79,224,255,.92);box-shadow:0 0 0 2px rgba(79,224,255,.12),0 0 24px rgba(79,224,255,.15),inset 0 0 20px rgba(255,73,190,.08)}.heroChoice.on::after{content:"ВЫБРАН";position:absolute;right:8px;top:7px;padding:4px 8px;border-radius:999px;background:linear-gradient(90deg,#44ddff,#6d59ff);font-size:8px;font-weight:900;letter-spacing:.05em}
.modeList{display:grid;gap:12px;margin-top:14px}.modeCard{position:relative;min-height:108px;padding:16px 178px 15px 20px;border-radius:28px;text-align:left;overflow:hidden;background:linear-gradient(145deg,rgba(42,49,151,.90),rgba(25,20,96,.96));border:1px solid rgba(255,255,255,.10);box-shadow:0 15px 32px rgba(0,0,0,.18)}.modeCard strong{display:block;font-size:clamp(22px,4.2vw,32px);line-height:1}.modeCard .desc{display:block;margin-top:7px;color:#d7d9ef;font-size:clamp(12px,2.3vw,16px);line-height:1.2;max-width:98%}.previewTiles{position:absolute;right:40px;top:50%;width:124px;height:82px;transform:translateY(-50%)}.previewTiles img{position:absolute;width:60px;height:60px;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.30))}.previewTiles img:nth-child(1){left:0;top:18px;transform:rotate(-9deg)}.previewTiles img:nth-child(2){left:31px;top:0;transform:rotate(6deg)}.previewTiles img:nth-child(3){left:62px;top:20px;transform:rotate(9deg)}.arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,rgba(60,221,255,.82),rgba(79,91,255,.84));font-size:28px;box-shadow:0 0 16px rgba(67,218,255,.25)}.modeCard.timed .arrow{background:linear-gradient(145deg,#ff5bc7,#ff8b55)}.recordsBtn{display:block;margin:13px auto 0;padding:11px 27px;border-radius:999px;background:linear-gradient(180deg,rgba(45,43,136,.92),rgba(24,18,86,.98));border:1px solid rgba(118,78,255,.45);font-weight:900;font-size:clamp(14px,2.7vw,19px)}
/* game */
#game{padding:7px 7px 10px;display:none;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:7px;justify-items:center;background:linear-gradient(180deg,#10106a,#080637 65%,#040118)}#game.active{display:grid}.topbar,.hud,.actorRow,.boardShell,.controls{width:min(100%,720px)}
.topbar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:7px}.brandDot,.soundBtn{width:48px;height:48px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11)}.brandDot img{width:41px;height:41px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(74,218,255,.28))}.soundBtn{font-size:21px}.gameTitle{text-align:center}.gameTitle h2{margin:0;font-size:clamp(21px,4.4vw,34px);line-height:.93}.gameTitle div{margin-top:2px;color:#d7daef;font-size:clamp(10px,1.9vw,13px)}
.hud{display:grid;grid-template-columns:1.12fr repeat(3,1fr);gap:6px}.hudBox{min-height:45px;padding:5px 7px;display:grid;place-items:center;text-align:center;border-radius:20px;background:linear-gradient(180deg,rgba(48,62,177,.92),rgba(25,27,106,.96));border:1px solid rgba(105,196,255,.28);font-size:clamp(10px,2vw,14px);font-weight:900;line-height:1.05}.hudBox.status{border-color:rgba(255,79,183,.48)}
.actorRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.actor{height:58px;display:grid;grid-template-columns:48px 1fr;align-items:center;gap:9px;padding:5px 10px;border-radius:21px;background:linear-gradient(145deg,rgba(36,40,133,.88),rgba(19,16,81,.96));border:1px solid rgba(72,221,255,.52)}.actor img{width:46px;height:46px;object-fit:contain;border-radius:14px;background:#12105a}.actorName{font-size:clamp(13px,2.6vw,18px);line-height:1}.actorSub{margin-top:3px;color:#c9cde6;font-size:clamp(9px,1.8vw,12px)}.toolRow{display:flex;gap:6px}.tool{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(42,45,144,.90),rgba(24,19,82,.98));border:1px solid rgba(255,255,255,.10);font-size:22px}.tool:disabled{opacity:.38}
.boardShell{min-height:0;height:100%;padding:10px;border-radius:31px;background:linear-gradient(180deg,#5a42ff,#331eaa 62%,#23116e);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 15px 28px rgba(0,0,0,.28),0 0 20px rgba(112,100,255,.18)}.board{position:relative;width:100%;height:100%;min-height:0;border-radius:23px;overflow:hidden;background:radial-gradient(circle at 20% 18%,rgba(36,145,255,.22),transparent 24%),radial-gradient(circle at 82% 75%,rgba(170,55,255,.16),transparent 24%),linear-gradient(180deg,#12196c,#091047 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}.board::before{content:"";position:absolute;inset:0;opacity:.38;background-image:radial-gradient(circle at 14% 18%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 74% 22%,#4ceaff 0 1px,transparent 1.5px),radial-gradient(circle at 28% 79%,#ff65c7 0 1px,transparent 1.5px),radial-gradient(circle at 88% 67%,#fff 0 1px,transparent 1.5px);background-size:160px 160px,210px 210px,240px 240px,190px 190px;pointer-events:none}
.tile{position:absolute;width:11.25%;aspect-ratio:1/1;border-radius:15%;padding:0;transition:transform .16s ease,filter .16s ease,opacity .20s ease;filter:drop-shadow(4px 7px 3px rgba(0,0,0,.32));transform-origin:center;overflow:visible}.tile img{width:100%;height:100%;object-fit:contain;pointer-events:none}.tile.blocked{filter:brightness(.63) saturate(.68) drop-shadow(3px 6px 3px rgba(0,0,0,.26));cursor:default}.tile.blocked img{opacity:.80}.tile.free{cursor:pointer}.tile.free:hover{transform:translateY(-2px)}.tile.selected{transform:translateY(-7px) scale(1.065);filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px #54e3ff) drop-shadow(0 0 17px #ff4db7)}.tile.hint{animation:hintGlow .8s ease-in-out infinite alternate}.tile.remove{opacity:0;transform:scale(.48) rotate(7deg);filter:drop-shadow(0 0 18px #6df5ff)}@keyframes hintGlow{from{transform:translateY(-2px);filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 9px #ff58bd)}to{transform:translateY(-7px) scale(1.055);filter:drop-shadow(0 0 7px #fff) drop-shadow(0 0 18px #58e8ff)}}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.ctrl{padding:13px 10px;border-radius:21px;background:linear-gradient(145deg,rgba(30,34,119,.94),rgba(16,13,65,.98));border:1px solid rgba(255,255,255,.10);font-weight:900;font-size:clamp(14px,2.5vw,18px)}
/* overlays */
.overlay{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;padding:10px;background:rgba(4,1,22,.70);backdrop-filter:blur(7px)}.overlay.open{display:flex}.sheet{width:100%;padding:23px 18px 18px;border-radius:29px;background:linear-gradient(160deg,rgba(15,9,60,.99),rgba(7,4,33,.995));border:1px solid rgba(113,94,255,.32);box-shadow:0 -20px 48px rgba(0,0,0,.45)}.sheet h3{margin:0 0 9px;font-size:clamp(24px,4vw,34px)}.sheet p{margin:0;color:#d0d3eb;line-height:1.35}.resultScore{margin-top:9px;font-weight:900;color:#89efff}.nameRow{display:flex;gap:8px;margin-top:13px}.nameRow input{flex:1;min-width:0;padding:12px 13px;border-radius:15px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);color:#fff;outline:none}.primary{padding:12px 18px;border-radius:999px;background:linear-gradient(90deg,var(--pink),#ff7076 58%,var(--orange));font-weight:900}.secondary{padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);font-weight:800}.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.error{min-height:17px;margin-top:5px;color:#ff9dc9;font-size:12px}.hide{display:none}.records{display:grid;gap:7px;max-height:54vh;overflow:auto}.record{display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:center;padding:10px 11px;border-radius:17px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.record small{display:block;color:#c5c8df;margin-top:2px}
@media(max-height:820px){#menu{padding-top:2.2%}.menuLogo{width:56px;height:56px}.menuTitle{font-size:clamp(32px,6.3vw,52px)}.menuSub{margin-bottom:10px}.heroChoice{height:74px;grid-template-columns:51px 1fr}.heroChoice img{width:49px;height:49px}.modeCard{min-height:92px}.previewTiles{height:70px}.previewTiles img{width:52px;height:52px}.boardShell{padding:8px}.topbar{grid-template-columns:43px 1fr 43px}.brandDot,.soundBtn{width:43px;height:43px}.actor{height:52px;grid-template-columns:42px 1fr}.actor img{width:40px;height:40px}.tool{width:46px;height:46px}.hudBox{min-height:41px}.ctrl{padding:10px 8px}}
@media(max-width:760px){body{display:block}#app{width:100vw;height:100dvh;max-width:none;aspect-ratio:auto;box-shadow:none}}
</style>

<body data-game="mahjong">
<div id="app"><div class="starfield"></div>
<section id="splash" class="screen active"><button id="startBtn" class="v12Start" type="button" aria-label="Начать игру">Начать игру</button></section>
<section id="menu" class="screen scroll">
<div class="menuInner">
<h1 class="menuTitle u"><span class="sr-only">Маджонг</span><img class="gameTitleArt" src="../../assets/titles/mahjong.png" alt="" aria-hidden="true"></h1><p class="menuSub">Классический «Маджонг-пасьянс» • находите пары одинаковых свободных плиток</p>
<div class="panel heroPanel"><div class="heroHead"><strong class="u">Выберите героя</strong><span id="heroNote">Выбран герой: Капитан Корги</span></div><div class="heroRow">
<button class="heroChoice on" data-hero="corgi"><img src="../../assets/corgi.png" alt="Капитан Корги"><div class="name u">Капитан<br>Корги</div></button>
<button class="heroChoice" data-hero="cat"><img src="../../assets/cat.png" alt="Космо-Кот"><div class="name u">Космо-<br>Кот</div></button></div></div>
<div class="modeList">
<button class="modeCard" data-mode="classic"><strong class="u">Классика</strong><span class="desc">Очистите всё поле • без ограничения времени</span><div class="previewTiles"><img src="assets/tile_star.png"><img src="assets/tile_planet.png"><img src="assets/tile_rocket.png"></div><span class="arrow">›</span></button>
<button class="modeCard timed" data-mode="timed"><strong class="u">На время</strong><span class="desc">Очистите поле как можно быстрее</span><div class="previewTiles"><img src="assets/tile_moon.png"><img src="assets/tile_galaxy.png"><img src="assets/tile_paw_pink.png"></div><span class="arrow">›</span></button>
</div><button id="recordsBtn" class="recordsBtn">🏆&nbsp; Рекорды</button></div></section>
<section id="game" class="screen">
<div class="topbar"><div class="brandDot"></div><div class="gameTitle"><h2 class="galaxy-title"><span class="sr-only">Маджонг</span><img class="gameTitleArt" src="../../assets/titles/mahjong.png" alt="" aria-hidden="true"></h2><div id="modeText">Классика</div></div><button id="soundBtn" class="soundBtn">🔊</button></div>
<div class="hud"><div id="statusBox" class="hudBox status">Ищите пары</div><div id="pairsBox" class="hudBox">Пары 0/40</div><div id="timeBox" class="hudBox">00:00</div><div id="scoreBox" class="hudBox">Очки 0</div></div>
<div class="actorRow"><div class="actor"><img id="actorImg" src='../../assets/corgi.png'><div><div id="actorName" class="actorName u">Капитан Корги</div><div class="actorSub">Ваш космический напарник</div></div></div><div class="toolRow"><button id="hintBtn" class="tool" title="Подсказка">💡</button><button id="shuffleBtn" class="tool" title="Перемешать">🔀</button></div></div>
<div class="boardShell"><div id="board" class="board"></div></div>

</section>
<div id="resultOverlay" class="overlay"><div class="sheet"><h3 id="resultTitle" class="u">Поле очищено!</h3><p id="resultText"></p><div id="resultScore" class="resultScore"></div><div id="nameRow" class="nameRow"><input id="recordName" maxlength="18" placeholder="Ваше имя"><button id="saveRecordBtn" class="primary">Сохранить</button></div><div id="nameError" class="error"></div><div class="sheetActions"><button id="resultMenu" class="secondary">В меню</button><button id="resultReplay" class="primary">Ещё раз</button></div></div></div>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const HERO={corgi:{name:'Капитан Корги',img:'../../assets/corgi.png'},cat:{name:'Космо-Кот',img:'../../assets/cat.png'}};
const FACES=[
['dog','assets/tile_dog.png'],['cat','assets/tile_cat.png'],['dog_helmet','assets/tile_dog_helmet.png'],['cat_helmet','assets/tile_cat_helmet.png'],
['paw_orange','assets/tile_paw_orange.png'],['paw_pink','assets/tile_paw_pink.png'],['duo','assets/tile_duo.png'],['rocket','assets/tile_rocket.png'],
['planet','assets/tile_planet.png'],['star','assets/tile_star.png'],['moon','assets/tile_moon.png'],['comet','assets/tile_comet.png'],
['ufo','assets/tile_ufo.png'],['helmet','assets/tile_helmet.png'],['satellite','assets/tile_satellite.png'],['galaxy','assets/tile_galaxy.png']
].map((x,i)=>({key:i,name:x[0],img:x[1]}));
const COPIES=[6,6,6,6,6,6,6,6,4,4,4,4,4,4,4,4]; // 80 tiles total, 40 pairs.
const bad=['fuck','shit','bitch','сука','хер','пизд','еба','нах'];
let hero='corgi',mode='classic',tiles=[],selected=null,pairs=0,score=0,seconds=0,timer=null,playing=false,soundOn=true,shuffleCount=0;
const TW=11.25, X0=4.1, Y0=10.0, DX=11.55, DY=13.0;
function show(id){if(id!=='game')GameLifecycle.begin();['splash','menu','game'].forEach(x=>$('#'+x).classList.toggle('active',x===id))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function layout(){const out=[];let id=0;function add(layer,rows,cols,gx0,gy0){for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)out.push({id:id++,layer,gx:gx0+c,gy:gy0+r,row:r,col:c,removed:false})}add(0,6,8,0,0);add(1,4,6,1,1);add(2,2,4,2,2);return out}
function buildFaces(){const a=[];FACES.forEach((f,i)=>{for(let k=0;k<COPIES[i];k++)a.push({key:f.key,img:f.img})});return shuffle(a)}
function makeTiles(){const pos=layout(),faces=buildFaces();tiles=pos.map((p,i)=>({...p,...faces[i]}));pairs=0;score=0;seconds=0;selected=null;shuffleCount=0;let guard=0;while(!availablePairs().length&&guard++<100)shuffleRemaining(false);render();updateHud()}
function hasAbove(t){return tiles.some(o=>!o.removed&&o.layer>t.layer&&o.gx===t.gx&&o.gy===t.gy)}
function side(t,dir){return tiles.some(o=>!o.removed&&o.layer===t.layer&&o.gy===t.gy&&o.gx===t.gx+dir)}
function free(t){return !t.removed&&!hasAbove(t)&&(!side(t,-1)||!side(t,1))}
function pos(t){return {left:X0+t.gx*DX+t.layer*.72,top:Y0+t.gy*DY-t.layer*.85}}
function render(){const board=$('#board');board.innerHTML='';[...tiles].sort((a,b)=>a.layer-b.layer||a.gy-b.gy||a.gx-b.gx).forEach(t=>{if(t.removed)return;const p=pos(t),b=document.createElement('button');b.className='tile '+(free(t)?'free':'blocked')+(selected===t.id?' selected':'');b.style.left=p.left+'%';b.style.top=p.top+'%';b.style.zIndex=10+t.layer*50+t.gy*2+t.gx;b.dataset.id=t.id;b.innerHTML=`<img src="${t.img}" alt="">`;b.onclick=()=>pick(t.id);board.appendChild(b)})}
function pick(id){if(!playing)return;const t=tiles.find(x=>x.id===id);if(!t||!free(t))return;sound('tap');if(selected===null){selected=id;render();return}if(selected===id){selected=null;render();return}const a=tiles.find(x=>x.id===selected);if(a&&free(a)&&a.key===t.key){animatePair([a.id,t.id],()=>{a.removed=t.removed=true;pairs++;score+=100+Math.max(0,50-seconds);selected=null;render();updateHud();sound('match');if(pairs===40){finish(true);return}if(!availablePairs().length)GameLifecycle.schedule(()=>shuffleRemaining(true),250)})}else{selected=id;sound('bad');render()}}
function animatePair(ids,done){ids.forEach(id=>document.querySelector(`.tile[data-id="${id}"]`)?.classList.add('remove'));GameLifecycle.schedule(done,210)}
function availablePairs(){const a=tiles.filter(free),out=[];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(a[i].key===a[j].key)out.push([a[i],a[j]]);return out}
function hint(){const a=availablePairs();if(!a.length){shuffleRemaining(true);return}const els=a[0].map(x=>document.querySelector(`.tile[data-id="${x.id}"]`));els.forEach(e=>e?.classList.add('hint'));GameLifecycle.schedule(()=>els.forEach(e=>e?.classList.remove('hint')),1600);score=Math.max(0,score-20);updateHud();sound('hint')}
function shuffleRemaining(penalize=true){const rem=tiles.filter(t=>!t.removed),f=shuffle(rem.map(t=>({key:t.key,img:t.img})));rem.forEach((t,i)=>Object.assign(t,f[i]));selected=null;shuffleCount++;if(penalize)score=Math.max(0,score-50);render();updateHud();sound('shuffle');if(!availablePairs().length&&shuffleCount<20)shuffleRemaining(false)}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function updateHud(){$('#pairsBox').textContent=`Пары ${pairs}/40`;$('#timeBox').textContent=fmt(seconds);$('#scoreBox').textContent=`Очки ${score}`;$('#statusBox').textContent=pairs===40?'Готово!':availablePairs().length?'Ищите пары':'Перемешиваем…'}
function startGame(m=mode){GameLifecycle.begin();mode=m;show('game');$('#modeText').textContent=mode==='timed'?'На время':'Классика';$('#actorImg').src=HERO[hero].img;$('#actorName').textContent=HERO[hero].name;GameLifecycle.cancel(timer);makeTiles();playing=true;timer=GameLifecycle.repeat(()=>{if(!playing)return;seconds++;if(mode==='timed'&&seconds>=300){finish(false);return}updateHud()},1000)}
function finish(win){playing=false;GameLifecycle.cancel(timer);if(win)score+=Math.max(0,1800-seconds*3);$('#resultTitle').textContent=win?'Поле очищено!':'Время вышло';$('#resultText').textContent=win?`Все 40 пар собраны за ${fmt(seconds)}.`:`За 5 минут собрано ${pairs} пар.`;$('#resultScore').textContent=`Очки ${score}`;const arr=records(),qualify=win&&(arr.length<10||score>(arr[arr.length-1]?.score||0));$('#nameRow').classList.toggle('hide',!qualify);$('#nameError').textContent='';$('#recordName').value='';$('#resultOverlay').classList.add('open');sound(win?'win':'lose')}
function records(){try{return JSON.parse(localStorage.getItem('youthMahjongV4Records')||'[]')}catch{return[]}}
function saveRecord(name){const a=records();a.push({name,score,time:seconds,mode,date:Date.now()});a.sort((x,y)=>y.score-x.score||x.time-y.time);localStorage.setItem('youthMahjongV4Records',JSON.stringify(a.slice(0,10)))}
function renderRecords(){const a=records(),box=$('#recordsList');box.innerHTML='';if(!a.length){box.innerHTML='<div class="record"><div>—</div><div>Пока нет результатов<small>Очистите первое поле</small></div><div>0</div></div>';return}a.forEach((r,i)=>{const e=document.createElement('div');e.className='record';e.innerHTML=`<div>${i+1}</div><div>${esc(r.name)}<small>${r.mode==='timed'?'На время':'Классика'} • ${fmt(r.time)}</small></div><div>${r.score}</div>`;box.appendChild(e)})}
function clean(s){return s.trim().replace(/\s+/g,' ').slice(0,18)}function badName(s){const t=s.toLowerCase().replace(/[^a-zа-яё0-9]/gi,'');return bad.some(x=>t.includes(x))}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let ac=null;function sound(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,g=ac.createGain();g.connect(ac.destination);g.gain.setValueAtTime(.05,t);const tone=(f,d,at=0,type='sine')=>{const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t+at);o.connect(g);o.start(t+at);o.stop(t+at+d)};if(kind==='match'){tone(560,.07);tone(790,.11,.07)}else if(kind==='bad'){tone(180,.07,0,'triangle')}else if(kind==='win'){tone(520,.08);tone(690,.08,.08);tone(920,.16,.16)}else if(kind==='shuffle'){tone(300,.05);tone(410,.05,.05);tone(520,.05,.1)}else tone(420,.05);g.gain.exponentialRampToValueAtTime(.001,t+.34)}catch(e){}}
$('#startBtn').onclick=()=>show('menu');$$('.heroChoice').forEach(b=>b.onclick=()=>{hero=b.dataset.hero;$$('.heroChoice').forEach(x=>x.classList.toggle('on',x===b));$('#heroNote').textContent='Выбран герой: '+HERO[hero].name});$$('.modeCard').forEach(b=>b.onclick=()=>startGame(b.dataset.mode));$('#hintBtn').onclick=hint;$('#shuffleBtn').onclick=()=>shuffleRemaining(true);$('#homeBtn').onclick=()=>{playing=false;GameLifecycle.cancel(timer);show('menu')};$('#newBtn').onclick=()=>startGame(mode);$('#screenBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();$('#soundBtn').onclick=()=>{soundOn=!soundOn;$('#soundBtn').textContent=soundOn?'🔊':'🔇'};$('#resultMenu').onclick=()=>{$('#resultOverlay').classList.remove('open');show('menu')};$('#resultReplay').onclick=()=>{$('#resultOverlay').classList.remove('open');startGame(mode)};$('#saveRecordBtn').onclick=()=>{const n=clean($('#recordName').value);if(n.length<2){$('#nameError').textContent='Введите имя от 2 символов';return}if(badName(n)){ $('#nameError').textContent='Это имя нельзя использовать';return}saveRecord(n);$('#nameError').textContent='Сохранено';$('#nameRow').classList.add('hide')};$('#recordsBtn').onclick=()=>{renderRecords();$('#recordsOverlay').classList.add('open')};$('#recordsClose').onclick=()=>$('#recordsOverlay').classList.remove('open');show('splash');
})();

window.GameLifecycle.engineInitialized=true;
</script>
