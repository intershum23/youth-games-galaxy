<style>

.boardShell{padding:10px;border-radius:30px;background:linear-gradient(180deg,#4d3ee5,#29177f);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 18px 34px rgba(0,0,0,.28)}.board{display:grid;gap:9px;aspect-ratio:1;padding:10px;border-radius:24px;background:linear-gradient(180deg,#16166d,#11114f);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}.board.size4{grid-template-columns:repeat(4,1fr)}.board.size5{grid-template-columns:repeat(5,1fr);gap:7px;padding:8px}.cell{position:relative;aspect-ratio:1;border-radius:20px;background:linear-gradient(145deg,#28266f,#1c1b55);box-shadow:inset 0 2px 0 rgba(255,255,255,.04),inset 0 -5px 12px rgba(0,0,0,.18);display:grid;place-items:center;overflow:hidden}.board.size5 .cell{border-radius:15px}.tile{width:100%;height:100%;border-radius:inherit;display:grid;place-items:center;font-family:var(--font-accent);font-weight:900;font-size:clamp(24px,7vw,54px);line-height:1;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -8px 14px rgba(0,0,0,.14),0 0 20px rgba(0,0,0,.12);animation:pop .14s ease-out}.board.size5 .tile{font-size:clamp(17px,5vw,38px)}.tile.v2{background:linear-gradient(145deg,#5bdfff,#399df8)}.tile.v4{background:linear-gradient(145deg,#8ed7ff,#7668ff)}.tile.v8{background:linear-gradient(145deg,#ff78d1,#f536ae)}.tile.v16{background:linear-gradient(145deg,#ec5fff,#b43cff)}.tile.v32{background:linear-gradient(145deg,#ff8a70,#ff5b4e)}.tile.v64{background:linear-gradient(145deg,#ffb55f,#ff7449)}.tile.v128{background:linear-gradient(145deg,#ffe66f,#ffb32f);color:#33220a}.tile.v256{background:linear-gradient(145deg,#ffcc4a,#ff8f28)}.tile.v512{background:linear-gradient(145deg,#94f49a,#34c983)}.tile.v1024{background:linear-gradient(145deg,#66f3e8,#19bbd4);font-size:.72em}.tile.v2048{background:linear-gradient(145deg,#fff18a,#ffb227 55%,#ff6d45);color:#361b00;box-shadow:0 0 26px rgba(255,205,64,.46),inset 0 1px 0 rgba(255,255,255,.5)}.tile.bigNum{font-size:.55em}@keyframes pop{from{transform:scale(.74);opacity:.4}to{transform:scale(1);opacity:1}}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.controls .ghost{padding:13px 10px;text-align:center;font-weight:900;font-size:clamp(14px,2.5vw,17px);border-radius:22px;background:linear-gradient(145deg,rgba(29,33,120,.92),rgba(17,14,68,.96));border:1px solid rgba(91,143,255,.28)}

/* overlays */
.overlay{position:absolute;inset:0;background:rgba(5,2,26,.72);backdrop-filter:blur(7px);display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:40}.overlay.open{display:flex}.sheet{width:min(100%,660px);padding:24px 18px 18px;border-radius:30px;background:linear-gradient(160deg,rgba(14,8,58,.985),rgba(7,4,33,.99));border:1px solid rgba(105,90,255,.28);box-shadow:0 -18px 48px rgba(0,0,0,.42)}.sheet h3{margin:0 0 9px;font-size:clamp(24px,4.2vw,33px)}.sheet p{margin:0;color:#ced1ec;line-height:1.35}.resultScore{margin-top:10px;font-weight:900;color:#95f5ff}.nameEntry{display:flex;gap:8px;margin-top:14px}.nameEntry input{flex:1;min-width:0;padding:13px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#fff;outline:none}.error{min-height:18px;margin-top:5px;color:#ff9fc8;font-size:12px}.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.recordsList{display:grid;gap:8px;max-height:55vh;overflow:auto;padding-right:4px}.record{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.record small{display:block;color:#c4c6dd}.hide{display:none}
@media(max-height:820px){.menuLogo{width:66px;height:66px}.heroOption{height:78px;grid-template-columns:56px 1fr}.heroOption img{width:56px;height:56px}.modeCard{min-height:82px}.modeCard strong{font-size:clamp(17px,3.4vw,24px)}.modeCard span{font-size:clamp(9px,1.8vw,12px)}.board{gap:7px;padding:8px}.hud .scoreCard{min-height:52px}.controls .ghost{padding:11px 8px}}
@media(max-width:760px){body{display:block}#app{width:100vw;height:100dvh;max-width:none;aspect-ratio:auto;box-shadow:none}.menuWrap,.topbar,.hud,.playerBar,.boardShell,.controls{width:100%;max-width:720px}.boardShell{width:min(96%,720px)}}
</style>

<body data-game="2048">
<div id="app">
  <div class="space"></div>

  <section id="splash" class="screen active"><button id="startBtn" class="v12Start" type="button" aria-label="Начать игру">Начать игру</button></section>

  <section id="menu" class="screen scroll">
    <div class="menuWrap">
      
      <h1 class="menuTitle u"><span class="sr-only">2048</span><img class="gameTitleArt" src="../../assets/titles/2048.png" alt="" aria-hidden="true"></h1>
      <p class="menuSub">Молодёжные 2048 • выберите героя и формат партии</p>
      <div class="heroPanel">
        <div class="heroHeader"><strong class="u">Выберите героя</strong><span id="heroNote">Выбран герой: Капитан Корги</span></div>
        <div class="heroRow">
          <button class="heroOption on" data-hero="corgi"><img src="../../assets/corgi.png" alt="Капитан Корги"><div class="heroName u">Капитан<br>Корги</div></button>
          <button class="heroOption" data-hero="cat"><img src="../../assets/cat.png" alt="Космо-Кот"><div class="heroName u">Космо-<br>Кот</div></button>
        </div>
      </div>
      <div class="modeGrid">
        <button class="modeCard classic" data-mode="classic"><span class="modeIcon">▦</span><strong class="u">Классика 4×4</strong><span>Стандартный 2048 • соберите плитку 2048</span><span class="modeArrow">›</span></button>
        <button class="modeCard big" data-mode="big"><span class="modeIcon">▦</span><strong class="u">Большое поле 5×5</strong><span>Больше пространства • длиннее партия • новые рекорды</span><span class="modeArrow">›</span></button>
        <button class="modeCard duo" data-mode="duo"><span class="modeIcon">👥</span><strong class="u">На двоих</strong><span>По очереди на одном поле • очки считаются каждому</span><span class="modeArrow">›</span></button>
      </div>
      <button id="recordsBtn" class="recordsBtn">🏆&nbsp; Рекорды</button>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="topbar">
      <div class="miniLogo"></div>
      <div class="gameTitle"><h2 class="galaxy-title"><span class="sr-only">2048</span><img class="gameTitleArt" src="../../assets/titles/2048.png" alt="" aria-hidden="true"></h2><div id="gameModeText">Классика • 4×4</div></div>
      <button id="soundBtn" class="sound" aria-label="Звук">🔊</button>
    </div>
    <div class="hud">
      <div class="scoreCard"><span id="scoreLabel">Счёт</span><strong id="scoreValue">0</strong></div>
      <div class="scoreCard"><span id="bestLabel">Рекорд</span><strong id="bestValue">0</strong></div>
      <div class="scoreCard"><span>Максимум</span><strong id="maxTile">2</strong></div>
    </div>
    <div class="playerBar">
      <img id="playerImg" src="assets/dog_head.png" alt="Герой">
      <div><div id="playerName" class="playerName u">Капитан Корги</div><div id="playerSub" class="playerSub">Соберите 2048</div></div>
      <div id="fieldBadge" class="modeBadge">Поле 4×4</div>
    </div>
    <div class="boardShell"><div id="board" class="board size4"></div></div>
    <div class="controls"><button id="homeBtn" class="ghost">В начало</button><button id="newBtn" class="ghost">Новая</button><button id="screenBtn" class="ghost">Экран</button></div>
  </section>

  <div id="resultOverlay" class="overlay"><div class="sheet"><h3 id="resultTitle" class="u">Игра окончена</h3><p id="resultText"></p><div id="resultScore" class="resultScore"></div><div id="nameEntry" class="nameEntry"><input id="recordName" maxlength="18" placeholder="Ваше имя"><button id="saveRecordBtn" class="primary" style="padding:12px 16px">Сохранить</button></div><div id="nameError" class="error"></div><div class="sheetActions"><button id="resultMenu" class="ghost">В меню</button><button id="resultReplay" class="primary">Ещё раз</button></div></div></div>
  <div id="milestoneOverlay" class="overlay"><div class="sheet"><h3 class="u">2048! ✨</h3><p>Главная плитка собрана. Можно продолжить и идти дальше.</p><div class="sheetActions"><button id="milestoneMenu" class="ghost">В меню</button><button id="milestoneContinue" class="primary">Продолжить</button></div></div></div>
  <div id="recordsOverlay" class="overlay"><div class="sheet"><h3 class="u">Рекорды</h3><div id="recordsList" class="recordsList"></div><div class="sheetActions" style="grid-template-columns:1fr"><button id="recordsClose" class="primary">Закрыть</button></div></div></div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const HERO={corgi:{name:'Капитан Корги',img:'../../assets/corgi.png'},cat:{name:'Космо-Кот',img:'../../assets/cat.png'}};
const BAD=['fuck','shit','bitch','сука','хер','пизд','еба','нах'];
let selectedHero='corgi',mode='classic',size=4,board=[],score=0,best=0,maxTile=2,soundOn=true,duoScores={p1:0,p2:0},duoTurn='p1',milestoneShown=false,gameEnded=false;
let touchStart=null;
function show(id){if(id!=='game')GameLifecycle.begin();['splash','menu','game'].forEach(k=>$('#'+k).classList.toggle('active',k===id))}
function modeKey(){return mode==='big'?'5x5':mode==='duo'?'duo':'4x4'}
function records(){try{return JSON.parse(localStorage.getItem('youth2048Records')||'[]')}catch{return []}}
function bestForMode(){const arr=records().filter(r=>r.mode===modeKey());return Math.max(arr.length?Math.max(...arr.map(r=>r.score)):0,window.YouthRecords?.getBest(modeKey(),'2048')||0)}
function startGame(m){GameLifecycle.begin();mode=m;size=m==='big'?5:4;score=0;duoScores={p1:0,p2:0};duoTurn='p1';milestoneShown=false;gameEnded=false;best=bestForMode();board=Array(size*size).fill(0);addTile();addTile();updateGameHeader();render();show('game');sound('start')}
function addTile(){const empty=[];board.forEach((v,i)=>{if(!v)empty.push(i)});if(!empty.length)return;const i=empty[Math.floor(Math.random()*empty.length)];board[i]=Math.random()<.9?2:4}
function compressLine(line){const vals=line.filter(Boolean);const out=[];let gained=0;for(let i=0;i<vals.length;i++){if(i<vals.length-1&&vals[i]===vals[i+1]){const v=vals[i]*2;out.push(v);gained+=v;i++;}else out.push(vals[i])}while(out.length<size)out.push(0);return{line:out,gained}}
function move(dir){if(gameEnded)return;const old=board.slice();let gained=0;const b=Array(size*size).fill(0);const get=(r,c)=>board[r*size+c],set=(r,c,v)=>{b[r*size+c]=v};
 if(dir==='left'||dir==='right'){for(let r=0;r<size;r++){let line=[];for(let c=0;c<size;c++)line.push(get(r,c));if(dir==='right')line.reverse();const res=compressLine(line);gained+=res.gained;let arr=res.line;if(dir==='right')arr=arr.reverse();for(let c=0;c<size;c++)set(r,c,arr[c])}}
 else{for(let c=0;c<size;c++){let line=[];for(let r=0;r<size;r++)line.push(get(r,c));if(dir==='down')line.reverse();const res=compressLine(line);gained+=res.gained;let arr=res.line;if(dir==='down')arr=arr.reverse();for(let r=0;r<size;r++)set(r,c,arr[r])}}
 if(b.every((v,i)=>v===old[i])){sound('blocked');return}
 board=b;if(mode==='duo'){duoScores[duoTurn]+=gained;duoTurn=duoTurn==='p1'?'p2':'p1'}else{score+=gained}
 addTile();maxTile=Math.max(...board);if(mode!=='duo'&&score>best){best=score;window.YouthRecords?.updateBest(modeKey(),score,'2048')};sound(gained>0?'merge':'move');render();
 if(maxTile>=2048&&!milestoneShown&&mode!=='duo'){milestoneShown=true;GameLifecycle.schedule(()=>$('#milestoneOverlay').classList.add('open'),160)}
 if(!canMove()){gameEnded=true;GameLifecycle.schedule(endGame,220)}
}
function canMove(){if(board.some(v=>v===0))return true;for(let r=0;r<size;r++)for(let c=0;c<size;c++){const v=board[r*size+c];if(c+1<size&&board[r*size+c+1]===v)return true;if(r+1<size&&board[(r+1)*size+c]===v)return true}return false}
function render(){const el=$('#board');el.className='board '+(size===5?'size5':'size4');el.innerHTML='';for(const v of board){const cell=document.createElement('div');cell.className='cell';if(v){const t=document.createElement('div');t.className='tile v'+Math.min(v,2048)+(v>=1024?' bigNum':'');t.textContent=v;cell.appendChild(t)}el.appendChild(cell)}maxTile=Math.max(2,...board);$('#maxTile').textContent=maxTile;updateHud()}
function updateGameHeader(){const hero=HERO[selectedHero];$('#playerImg').src=hero.img;$('#playerName').textContent=hero.name;$('#fieldBadge').textContent='Поле '+size+'×'+size;$('#gameModeText').textContent=mode==='classic'?'Классика • 4×4':mode==='big'?'Большое поле • 5×5':'На двоих • 4×4';$('#scoreLabel').textContent=mode==='duo'?'Игрок 1':'Счёт';$('#bestLabel').textContent=mode==='duo'?'Игрок 2':'Рекорд';$('#playerSub').textContent=mode==='duo'?'Ход: '+(duoTurn==='p1'?HERO[selectedHero].name:HERO[selectedHero==='corgi'?'cat':'corgi'].name):'Соберите плитку 2048'}
function updateHud(){if(mode==='duo'){$('#scoreValue').textContent=duoScores.p1;$('#bestValue').textContent=duoScores.p2;const h=duoTurn==='p1'?selectedHero:(selectedHero==='corgi'?'cat':'corgi');$('#playerImg').src=HERO[h].img;$('#playerName').textContent=HERO[h].name;$('#playerSub').textContent='Ход игрока • '+(duoTurn==='p1'?'розовые':'голубые')}else{$('#scoreValue').textContent=score;$('#bestValue').textContent=Math.max(best,score)}}
function endGame(){let finalScore=score,title='Игра окончена',text='Свободных ходов больше нет.';if(mode==='duo'){finalScore=Math.max(duoScores.p1,duoScores.p2);const h1=HERO[selectedHero].name,h2=HERO[selectedHero==='corgi'?'cat':'corgi'].name;if(duoScores.p1===duoScores.p2){title='Ничья';text=`${h1}: ${duoScores.p1} • ${h2}: ${duoScores.p2}`}else{const w=duoScores.p1>duoScores.p2?h1:h2;title='Победа!';text=`${w} набрал больше очков. ${duoScores.p1} : ${duoScores.p2}`}}$('#resultTitle').textContent=title;$('#resultText').textContent=text;$('#resultScore').textContent='Результат '+finalScore;const arr=records().filter(r=>r.mode===modeKey());const qualify=arr.length<10||finalScore>(arr[arr.length-1]?.score||0);$('#nameEntry').classList.toggle('hide',!qualify);$('#recordName').value='';$('#nameError').textContent='';$('#resultOverlay').classList.add('open');sound('end')}
function saveRecord(name){const finalScore=mode==='duo'?Math.max(duoScores.p1,duoScores.p2):score;const arr=records();arr.push({name,score:finalScore,mode:modeKey(),max:maxTile,date:Date.now()});arr.sort((a,b)=>b.score-a.score);localStorage.setItem('youth2048Records',JSON.stringify(arr.slice(0,30)))}
function renderRecords(){const box=$('#recordsList'),arr=records();box.innerHTML='';if(!arr.length){box.innerHTML='<div class="record"><div>—</div><div>Пока нет результатов<small>Сыграйте первую партию</small></div><div>0</div></div>';return}arr.slice(0,12).forEach((r,i)=>{const modeLabel=r.mode==='5x5'?'5×5':r.mode==='duo'?'На двоих':'4×4';const row=document.createElement('div');row.className='record';row.innerHTML=`<div>${i+1}</div><div>${esc(r.name)}<small>${modeLabel} • максимум ${r.max||2}</small></div><div>${r.score}</div>`;box.appendChild(row)})}
function clean(s){return s.trim().replace(/\s+/g,' ').slice(0,18)}function badName(s){const t=s.toLowerCase().replace(/[^a-zа-яё0-9]/gi,'');return BAD.some(x=>t.includes(x))}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let actx=null;function sound(kind){if(!soundOn)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime,g=actx.createGain();g.connect(actx.destination);g.gain.setValueAtTime(.055,t);const mk=(f,type,d,at=0)=>{const o=actx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t+at);o.connect(g);o.start(t+at);o.stop(t+at+d)};if(kind==='merge'){mk(520,'triangle',.08);mk(780,'sine',.10,.05)}else if(kind==='move'){mk(350,'sine',.06)}else if(kind==='blocked'){mk(180,'sine',.05)}else if(kind==='end'){mk(220,'triangle',.12);mk(170,'sine',.13,.10)}else{mk(420,'sine',.08)}g.gain.exponentialRampToValueAtTime(.001,t+.35)}catch(e){}}
function keyDir(k){return({ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'})[k]}
window.addEventListener('keydown',e=>{const d=keyDir(e.key);if(d&&$('#game').classList.contains('active')){e.preventDefault();move(d)}});
const app=$('#app');app.addEventListener('touchstart',e=>{if(!$('#game').classList.contains('active'))return;const t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY}},{passive:true});app.addEventListener('touchend',e=>{if(!touchStart||!$('#game').classList.contains('active'))return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});
$('#startBtn').onclick=()=>show('menu');$$('.heroOption').forEach(b=>b.onclick=()=>{selectedHero=b.dataset.hero;$$('.heroOption').forEach(x=>x.classList.toggle('on',x===b));$('#heroNote').textContent='Выбран герой: '+HERO[selectedHero].name});$$('.modeCard').forEach(b=>b.onclick=()=>startGame(b.dataset.mode));$('#homeBtn').onclick=()=>show('menu');$('#newBtn').onclick=()=>startGame(mode);$('#screenBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();$('#soundBtn').onclick=()=>{soundOn=!soundOn;$('#soundBtn').textContent=soundOn?'🔊':'🔇'};$('#resultMenu').onclick=()=>{$('#resultOverlay').classList.remove('open');show('menu')};$('#resultReplay').onclick=()=>{$('#resultOverlay').classList.remove('open');startGame(mode)};$('#milestoneMenu').onclick=()=>{$('#milestoneOverlay').classList.remove('open');show('menu')};$('#milestoneContinue').onclick=()=>$('#milestoneOverlay').classList.remove('open');$('#saveRecordBtn').onclick=()=>{const n=clean($('#recordName').value);if(n.length<2){$('#nameError').textContent='Введите имя от 2 символов';return}if(badName(n)){ $('#nameError').textContent='Это имя нельзя использовать';return}saveRecord(n);$('#nameError').textContent='Сохранено';$('#nameEntry').classList.add('hide')};$('#recordsBtn').onclick=()=>{renderRecords();$('#recordsOverlay').classList.add('open')};$('#recordsClose').onclick=()=>$('#recordsOverlay').classList.remove('open');
show('splash');
})();

window.GameLifecycle.engineInitialized=true;
</script>
