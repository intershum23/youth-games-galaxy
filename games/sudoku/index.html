mp(10px,1.9vw,13px);color:#c9cde6}.miniTools{display:flex;gap:7px}.miniTool{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,rgba(42,45,144,.89),rgba(24,19,82,.97));border:1px solid rgba(255,255,255,.10);font-size:21px;display:grid;place-items:center}
.boardWrap{padding:10px;border-radius:29px;background:linear-gradient(180deg,#583fff,#301da4 62%,#201064);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 14px 28px rgba(0,0,0,.27),0 0 20px rgba(110,105,255,.15)}.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;border-radius:20px;overflow:hidden;background:#10176a;border:2px solid rgba(255,255,255,.12)}.cell{position:relative;min-width:0;aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(145deg,#243791,#16256f);border-right:1px solid rgba(118,214,255,.28);border-bottom:1px solid rgba(118,214,255,.28);font-weight:900;font-size:clamp(16px,4.2vw,30px);color:#fff;padding:0}.cell:nth-child(3n){border-right:3px solid rgba(89,226,255,.86)}.cell:nth-child(9n){border-right:0}.cell.boxBottom{border-bottom:3px solid rgba(89,226,255,.86)}.cell.given{color:#b8e9ff;background:linear-gradient(145deg,#1b2f85,#142266)}.cell.selected{background:linear-gradient(145deg,#3155c5,#243c9c);box-shadow:inset 0 0 0 3px rgba(255,89,196,.72)}.cell.peer{background:linear-gradient(145deg,#283f9e,#1d307d)}.cell.same{box-shadow:inset 0 0 0 2px rgba(80,228,255,.48)}.cell.wrong{color:#ff87a8;background:linear-gradient(145deg,#632664,#4b2057)}.notes{position:absolute;inset:3px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(6px,1.5vw,10px);line-height:1;color:#c9dbff;font-weight:700}.notes span{display:grid;place-items:center}.gameTools{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.gameTools button{padding:9px 6px;border-radius:14px;background:linear-gradient(145deg,rgba(39,43,137,.92),rgba(20,17,75,.98));border:1px solid rgba(255,255,255,.10);font-size:clamp(10px,2vw,13px);font-weight:800}.gameTools button.on{border-color:rgba(85,231,255,.88);box-shadow:0 0 15px rgba(85,231,255,.16)}.keypad{width:min(100%,720px);display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.keypad button{aspect-ratio:1;border-radius:12px;background:linear-gradient(145deg,#2d45b3,#1b2a7b);border:1px solid rgba(100,213,255,.26);font-size:clamp(14px,3vw,20px);font-weight:900}.keypad .erase{font-size:16px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.controls .ghost{padding:11px 8px;text-align:center}
.overlay{position:absolute;inset:0;background:rgba(5,2,26,.73);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:40}.overlay.open{display:flex}.resultScore{margin-top:10px;font-weight:900;color:#98f2ff}.nameEntry{display:flex;gap:8px;margin-top:13px}.nameEntry input{flex:1;min-width:0;padding:12px;border-radius:15px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);color:#fff;outline:none}.error{min-height:18px;margin-top:5px;color:#ff9fc8;font-size:12px}.recordsList{display:grid;gap:8px;max-height:55vh;overflow:auto}.record{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;padding:10px;border-radius:17px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.record small{display:block;color:#c4c6dd}.hide{display:none}
@media(max-height:820px){.menuLogo{width:58px;height:58px}.heroOption{height:76px;grid-template-columns:48px 1fr}.heroOption img{width:46px;height:46px}.modeCard{min-height:88px}.boardWrap{padding:8px}.cell{font-size:clamp(14px,3.7vw,26px)}.gameTools button{padding:7px 4px}.keypad{gap:4px}.controls .ghost{padding:9px 7px}}

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const HERO={corgi:{name:'Капитан Корги',img:'../../assets/corgi.png'},cat:{name:'Космо-Кот',img:'../../assets/cat.png'}};
const bad=['fuck','shit','bitch','сука','хер','пизд','еба','нах'];
let hero='corgi',mode='classic',difficulty='easy',solution=[],puzzle=[],values=[],notes=[],selected=-1,seconds=0,timerId=null,playing=false,soundOn=true,notesMode=false,mistakes=0,hints=0,score=0,startPuzzle=[];
const idx=(r,c)=>r*9+c, rc=i=>[Math.floor(i/9),i%9];
function show(id){if(id!=='game')GameLifecycle.begin();['splash','menu','game'].forEach(k=>$('#'+k).classList.toggle('active',k===id));}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pattern(r,c){return (r*3+Math.floor(r/3)+c)%9}
function makeSolution(){const base=[0,1,2,3,4,5,6,7,8], nums=shuffle([1,2,3,4,5,6,7,8,9]);const bands=shuffle([0,1,2]), stacks=shuffle([0,1,2]);let rows=[],cols=[];bands.forEach(b=>shuffle([0,1,2]).forEach(x=>rows.push(b*3+x)));stacks.forEach(s=>shuffle([0,1,2]).forEach(x=>cols.push(s*3+x)));let out=[];rows.forEach(r=>cols.forEach(c=>out.push(nums[pattern(r,c)])));return out}
function makePuzzle(){solution=makeSolution();puzzle=[...solution];const remove={easy:40,medium:50,hard:56}[difficulty];const ids=shuffle(Array.from({length:81},(_,i)=>i));for(let k=0;k<remove;k++) puzzle[ids[k]]=0;values=[...puzzle];startPuzzle=[...puzzle];notes=Array.from({length:81},()=>new Set());selected=-1;mistakes=0;hints=0;score=0;seconds=0;notesMode=false;$('#notesBtn').classList.remove('on');render();updateHud()}
function peer(a,b){if(a<0||b<0)return false;const[ar,ac]=rc(a),[br,bc]=rc(b);return ar===br||ac===bc||(Math.floor(ar/3)===Math.floor(br/3)&&Math.floor(ac/3)===Math.floor(bc/3))}
function render(){const b=$('#board');b.innerHTML='';for(let i=0;i<81;i++){const [r,c]=rc(i),el=document.createElement('button');el.className='cell';if(puzzle[i])el.classList.add('given');if(i===selected)el.classList.add('selected');else if(peer(i,selected))el.classList.add('peer');if(selected>=0&&values[selected]&&values[i]===values[selected])el.classList.add('same');if(r===2||r===5)el.classList.add('boxBottom');if(values[i]&&!puzzle[i]&&values[i]!==solution[i])el.classList.add('wrong');if(values[i]) el.textContent=values[i]; else if(notes[i].size){const n=document.createElement('div');n.className='notes';for(let x=1;x<=9;x++){const s=document.createElement('span');s.textContent=notes[i].has(x)?x:'';n.appendChild(s)}el.appendChild(n)}el.onclick=()=>{if(!puzzle[i]){selected=i;sound('tap');render()}};b.appendChild(el)}}
function inputNum(n){if(!playing||selected<0||puzzle[selected])return;if(notesMode){if(values[selected])values[selected]=0;if(notes[selected].has(n))notes[selected].delete(n);else notes[selected].add(n);sound('tap');render();return}const wasCorrect=values[selected]===solution[selected];notes[selected].clear();values[selected]=n;if(n!==solution[selected]){mistakes++;score=Math.max(0,score-25);sound('bad')}else{if(!wasCorrect)score+=100;sound('good');for(let s of notes)s.delete(n)}render();updateHud();checkFinished()}
function erase(){if(selected<0||puzzle[selected])return;values[selected]=0;notes[selected].clear();sound('tap');render()}
function hint(){if(!playing)return;const empty=[];for(let i=0;i<81;i++)if(!puzzle[i]&&values[i]!==solution[i])empty.push(i);if(!empty.length)return;const i=empty[Math.floor(Math.random()*empty.length)];values[i]=solution[i];notes[i].clear();selected=i;hints++;score=Math.max(0,score-50);sound('hint');render();updateHud();checkFinished()}
function checkBoard(){let wrong=0;for(let i=0;i<81;i++)if(values[i]&&values[i]!==solution[i])wrong++;$('#statusBox').textContent=wrong?`Есть ошибки: ${wrong}`:'Пока всё верно';sound(wrong?'bad':'good')}
function checkFinished(){if(values.every((v,i)=>v===solution[i])) finish(true)}
function limitSeconds(){return {easy:900,medium:1200,hard:1500}[difficulty]}
function startGame(){GameLifecycle.begin();show('game');$('#setupOverlay').style.display='none';$('#modeText').textContent=(mode==='timed'?'На время':'Классика')+' • '+({easy:'Лёгкий',medium:'Средний',hard:'Сложный'}[difficulty]);$('#actorImg').src=HERO[hero].img;$('#actorName').textContent=HERO[hero].name;GameLifecycle.cancel(timerId);makePuzzle();playing=true;timerId=GameLifecycle.repeat(()=>{if(!playing)return;seconds++;if(mode==='timed'&&seconds>=limitSeconds()){finish(false);return}updateHud()},1000)}
function restart(){values=[...startPuzzle];notes=Array.from({length:81},()=>new Set());selected=-1;mistakes=0;hints=0;seconds=0;render();updateHud();sound('tap')}
function updateHud(){let t=mode==='timed'?Math.max(0,limitSeconds()-seconds):seconds;$('#timeBox').textContent=formatTime(t);$('#mistakeBox').textContent=`Ошибки ${mistakes}`;$('#scoreBox').textContent=`Очки ${score}`;if($('#statusBox').textContent.startsWith('Есть')||$('#statusBox').textContent==='Пока всё верно'){}else $('#statusBox').textContent='Заполните поле'}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function finish(win){if(!playing)return;playing=false;GameLifecycle.cancel(timerId);if(win){score+=difficulty==='hard'?900:difficulty==='medium'?600:400;score+=Math.max(0,1200-seconds*2);if(mode==='timed')score+=300}$('#resultTitle').textContent=win?'Судоку решено!':'Время вышло';$('#resultText').textContent=win?`Время: ${formatTime(seconds)} • ошибок: ${mistakes} • подсказок: ${hints}.`:`Заполнено ${values.filter(Boolean).length} из 81 клеток.`;$('#resultScore').textContent=`Очки ${score}`;const qualify=win&&(records().length<10||score>(records().at(-1)?.score||0));$('#nameEntry').classList.toggle('hide',!qualify);$('#nameError').textContent='';$('#recordName').value='';$('#resultOverlay').classList.add('open');sound(win?'win':'lose')}
function records(){try{return JSON.parse(localStorage.getItem('youthSudokuRecords')||'[]')}catch{return[]}}
function saveRecord(name){const arr=records();arr.push({name,score,time:seconds,mode,difficulty,mistakes});arr.sort((a,b)=>b.score-a.score||a.time-b.time);localStorage.setItem('youthSudokuRecords',JSON.stringify(arr.slice(0,10)))}
function renderRecords(){const arr=records(),box=$('#recordsList');box.innerHTML=arr.length?'':'<div class="record"><div>—</div><div>Пока нет результатов<small>Решите первое Судоку</small></div><div>0</div></div>';arr.forEach((r,i)=>{const e=document.createElement('div');e.className='record';e.innerHTML=`<div>${i+1}</div><div>${esc(r.name)}<small>${r.mode==='timed'?'На время':'Классика'} • ${r.difficulty} • ${formatTime(r.time)}</small></div><div>${r.score}</div>`;box.appendChild(e)})}
function clean(s){return s.trim().replace(/\s+/g,' ').slice(0,18)}function badName(s){const t=s.toLowerCase().replace(/[^a-zа-яё0-9]/gi,'');return bad.some(x=>t.includes(x))}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let ac=null;function sound(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,g=ac.createGain();g.connect(ac.destination);g.gain.setValueAtTime(.05,t);const mk=(f,d,a=0,type='sine')=>{const o=ac.createOscillator();o.type=type;o.frequency.value=f;o.connect(g);o.start(t+a);o.stop(t+a+d)};if(kind==='good'){mk(540,.06);mk(700,.08,.06)}else if(kind==='bad'){mk(180,.09,0,'triangle')}else if(kind==='win'){mk(520,.08);mk(680,.08,.08);mk(900,.16,.16)}else if(kind==='lose'){mk(220,.12);mk(170,.16,.12)}else if(kind==='hint'){mk(760,.08);mk(920,.1,.08)}else mk(430,.05);g.gain.exponentialRampToValueAtTime(.001,t+.35)}catch(e){}}
$('#keypad').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')+'<button class="erase">⌫</button>';$$('#keypad button[data-n]').forEach(b=>b.onclick=()=>inputNum(+b.dataset.n));$('#keypad .erase').onclick=erase;
$('#startBtn').onclick=()=>show('menu');$$('.heroOption').forEach(b=>b.onclick=()=>{hero=b.dataset.hero;$$('.heroOption').forEach(x=>x.classList.toggle('on',x===b));$('#heroNote').textContent='Выбран герой: '+HERO[hero].name});$$('.modeCard').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$('#setupOverlay').style.display='flex'});$$('#difficulty button').forEach(b=>b.onclick=()=>{$$('#difficulty button').forEach(x=>x.classList.remove('on'));b.classList.add('on');difficulty=b.dataset.level});$('#setupBack').onclick=()=>$('#setupOverlay').style.display='none';$('#setupStart').onclick=startGame;$('#notesBtn').onclick=()=>{notesMode=!notesMode;$('#notesBtn').classList.toggle('on',notesMode);sound('tap')};$('#eraseBtn').onclick=erase;$('#hintBtn').onclick=hint;$('#checkBtn').onclick=checkBoard;$('#hintBoardBtn').onclick=hint;$('#checkBoardBtn').onclick=checkBoard;$('#homeBtn').onclick=()=>{playing=false;GameLifecycle.cancel(timerId);show('menu')};$('#newBtn').onclick=startGame;$('#screenBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();$('#soundBtn').onclick=()=>{soundOn=!soundOn;$('#soundBtn').textContent=soundOn?'🔊':'🔇'};$('#resultMenu').onclick=()=>{$('#resultOverlay').classList.remove('open');show('menu')};$('#resultReplay').onclick=()=>{$('#resultOverlay').classList.remove('open');startGame()};$('#saveRecordBtn').onclick=()=>{const n=clean($('#recordName').value);if(n.length<2){$('#nameError').textContent='Введите имя от 2 символов';return}if(badName(n)){ $('#nameError').textContent='Это имя нельзя использовать';return}saveRecord(n);$('#nameError').textContent='Сохранено';$('#nameEntry').classList.add('hide')};$('#recordsBtn').onclick=()=>{renderRecords();$('#recordsOverlay').classList.add('open')};$('#recordsClose').onclick=()=>$('#recordsOverlay').classList.remove('open');document.addEventListener('keydown',e=>{if(!playing)return;if(/^[1-9]$/.test(e.key))inputNum(+e.key);else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')erase();else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();let i=selected<0?0:selected;const[r,c]=rc(i);let nr=r,nc=c;if(e.key==='ArrowUp')nr=Math.max(0,r-1);if(e.key==='ArrowDown')nr=Math.min(8,r+1);if(e.key==='ArrowLeft')nc=Math.max(0,c-1);if(e.key==='ArrowRight')nc=Math.min(8,c+1);selected=idx(nr,nc);render()}});show('splash');
})();

window.GameLifecycle.engineInitialized=true;
</script>
