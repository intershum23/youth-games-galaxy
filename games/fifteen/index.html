<style>
:root{--pink:#ff4db5;--pink2:#ff7380;--orange:#ffae3f;--cyan:#4edfff;--cyan2:#a9f8ff;--violet:#7163ff;--panel:rgba(38,34,129,.88);--panel2:rgba(19,14,77,.96);--muted:#d5d8ef;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040113;color:#fff;font-family:var(--font-ui)}button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}img{display:block;max-width:100%}.u{font-family:var(--font-accent)}
body{display:grid;place-items:center;background:radial-gradient(circle at 12% 12%,rgba(67,214,255,.16),transparent 22%),radial-gradient(circle at 86% 86%,rgba(255,74,196,.14),transparent 26%),linear-gradient(145deg,#020012,#100435 56%,#030114)}
#app{position:relative;height:min(100dvh,100vh);aspect-ratio:9/16;max-width:100vw;overflow:hidden;background:linear-gradient(180deg,#18207b,#090735 58%,#040118);box-shadow:0 0 80px rgba(0,0,0,.48)}
.space{position:absolute;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 16% 18%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 84% 26%,#6be6ff 0 1.2px,transparent 1.7px),radial-gradient(circle at 18% 48%,#ff72cf 0 1px,transparent 1.5px),radial-gradient(circle at 72% 68%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 58% 88%,#72eaff 0 1px,transparent 1.5px);background-size:240px 240px,300px 300px,340px 340px,270px 270px,330px 330px;opacity:.55}.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;z-index:1}.screen.active{display:flex}.scroll{overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.primary{padding:16px 26px;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--pink2) 58%,var(--orange));box-shadow:0 14px 32px rgba(255,68,140,.26),inset 0 1px 0 rgba(255,255,255,.35);font-family:var(--font-accent);font-weight:900}.ghost{padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);font-weight:800}.pill{padding:8px 12px;border-radius:999px;background:linear-gradient(180deg,rgba(50,65,182,.88),rgba(26,28,109,.94));border:1px solid rgba(115,200,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 18px rgba(0,0,0,.16)}
/* Splash */
#splash{overflow:hidden;background:#06031f}#splash .poster{position:absolute;inset:0;background:url('assets/splash_fifteen.png') center/cover no-repeat}#splash .hit{position:absolute;inset:0;z-index:3;opacity:0}
/* Menu */
#menu{padding:3.5% 4.8% 3.2%;justify-content:flex-start;background:linear-gradient(180deg,#18207b,#0a073a 57%,#040118)}.menuWrap{position:relative;z-index:2;width:100%;max-width:720px;padding-bottom:16px}.menuLogo{width:66px;height:66px;margin:0 auto 6px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(63,209,255,.26)) drop-shadow(0 8px 14px rgba(0,0,0,.18))}.menuTitle{margin:0;text-align:center;font-size:clamp(34px,6.4vw,58px);line-height:.92;letter-spacing:-.065em}.menuSub{margin:8px auto 13px;max-width:94%;text-align:center;color:var(--muted);font-size:clamp(11px,2.2vw,16px);line-height:1.26}
.heroPanel{padding:13px 14px;border-radius:30px;background:linear-gradient(145deg,rgba(56,63,167,.54),rgba(28,22,104,.78));border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 38px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.05)}.heroHeader{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}.heroHeader strong{font-size:clamp(18px,4vw,28px);line-height:1}.heroHeader span{display:block;max-width:46%;text-align:right;color:#d5d8ee;font-size:clamp(9px,1.9vw,13px);line-height:1.2}.heroRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.heroOption{position:relative;height:84px;padding:9px 10px;display:grid;grid-template-columns:60px minmax(0,1fr);align-items:center;gap:9px;border-radius:22px;background:linear-gradient(145deg,rgba(49,52,160,.76),rgba(31,23,107,.90));border:1px solid rgba(255,255,255,.09);overflow:hidden;text-align:left}.heroOption::after{content:"";position:absolute;right:-24px;top:-14px;width:96px;height:96px;border-radius:50%;opacity:.18;filter:blur(16px);background:var(--glow,#47ddff)}.heroOption[data-hero="cat"]{--glow:#ff63bc}.heroOption.on{background:linear-gradient(145deg,rgba(45,102,191,.84),rgba(77,30,157,.90));border-color:rgba(102,231,255,.85);box-shadow:0 0 0 2px rgba(102,231,255,.12),0 0 20px rgba(102,231,255,.16),inset 0 0 20px rgba(255,73,190,.10)}.heroOption img{position:relative;z-index:2;width:60px;height:60px;object-fit:contain;border-radius:16px;background:linear-gradient(145deg,#17156f,#0f0d47);border:1px solid rgba(255,255,255,.11)}.heroName{position:relative;z-index:2;font-size:clamp(13px,2.7vw,19px);font-weight:900;line-height:1.02;letter-spacing:-.03em}
.modeGrid{display:grid;gap:12px;margin-top:14px}.modeCard{position:relative;min-height:104px;padding:12px 72px 12px 86px;border-radius:28px;text-align:left;overflow:hidden;background:linear-gradient(145deg,rgba(42,50,154,.92),rgba(25,19,100,.96));border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 30px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.05)}.modeCard::after{content:"";position:absolute;right:-24px;top:50%;transform:translateY(-50%);width:132px;height:132px;border-radius:50%;opacity:.92}.modeCard.classic::after{background:radial-gradient(circle at 35% 35%,#6feaff 0%,#35d6f4 45%,#77f5c2 100%)}.modeCard.timed::after{background:radial-gradient(circle at 35% 35%,#ff6bca 0%,#f45b9f 48%,#ffab43 100%)}.modeThumb{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(43,54,170,.95),rgba(31,20,110,.98));border:1px solid rgba(113,212,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 8px 18px rgba(0,0,0,.16);z-index:3}.miniPuzzle{width:46px;height:46px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}.miniPuzzle i{display:grid;place-items:center;border-radius:4px;background:linear-gradient(145deg,#42caff,#3568ff);font-style:normal;font-size:7px;font-weight:900;color:white;box-shadow:inset 0 1px 1px rgba(255,255,255,.35)}.miniPuzzle i:nth-child(15){background:linear-gradient(145deg,#ff59c0,#ff6b80)}.miniPuzzle i:last-child{background:rgba(255,255,255,.08)}.clockIcon{position:relative;width:42px;height:42px;border-radius:50%;border:4px solid #ff65d0;box-shadow:0 0 12px rgba(255,86,209,.35),inset 0 0 10px rgba(255,117,198,.18)}.clockIcon::before{content:"";position:absolute;width:4px;height:15px;border-radius:4px;background:#fff;left:50%;top:7px;transform:translateX(-50%) rotate(18deg);transform-origin:50% 100%}.clockIcon::after{content:"";position:absolute;left:50%;top:-10px;width:16px;height:7px;border-radius:5px;background:#ffad3f;transform:translateX(-50%);box-shadow:0 0 8px rgba(255,173,63,.45)}.speedLines{position:absolute;left:7px;top:23px;width:12px;height:3px;border-radius:4px;background:#ff8add;box-shadow:0 8px 0 #ff8add,0 -8px 0 #ff8add}.modeCard strong,.modeCard .desc,.modeArrow{position:relative;z-index:3;display:block}.modeCard strong{font-size:clamp(20px,4.2vw,31px);line-height:1;letter-spacing:-.04em}.modeCard .desc{margin-top:6px;max-width:78%;color:#d9dbef;font-size:clamp(11px,2.1vw,15px);line-height:1.18}.modeArrow{position:absolute;right:17px;top:50%;transform:translateY(-50%);font-size:34px;font-weight:300;opacity:.95}.recordsBtn{display:block;margin:12px auto 0;padding:10px 24px;border-radius:999px;background:linear-gradient(180deg,rgba(45,43,136,.92),rgba(24,18,86,.98));border:1px solid rgba(118,78,255,.40);font-weight:800;font-size:clamp(13px,2.5vw,17px)}
/* Game */
#game{padding:9px 8px 11px;display:none;grid-template-rows:auto auto auto 1fr auto;gap:8px;justify-items:center;align-content:start;background:linear-gradient(180deg,#10106a,#080636 65%,#040118)}#game.active{display:grid}.topbar,.hud,.playerBar,.boardShell,.controls{width:min(100%,720px)}.topbar{display:grid;grid-template-columns:52px 1fr 50px;align-items:center;gap:8px}.miniLogo{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12)}.miniLogo img{width:80%;height:80%;object-fit:contain}.gameTitle{text-align:center}.gameTitle h2{margin:0;font-size:clamp(23px,4.5vw,37px);line-height:.92;letter-spacing:-.05em}.gameTitle div{color:#d6d9ee;font-size:clamp(10px,2vw,14px);margin-top:3px}.sound{width:50px;height:50px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);display:grid;place-items:center;font-size:23px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.scoreCard{min-height:58px;padding:8px 10px;border-radius:22px;text-align:center;background:linear-gradient(145deg,rgba(38,42,139,.86),rgba(22,18,92,.96));border:1px solid rgba(94,188,255,.24)}.scoreCard span{display:block;color:#cfd3eb;font-size:clamp(10px,2vw,13px)}.scoreCard strong{display:block;font-family:var(--font-accent);font-size:clamp(18px,3.4vw,25px);line-height:1.05;margin-top:2px}.playerBar{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:10px;padding:8px 12px;border-radius:24px;background:linear-gradient(145deg,rgba(36,40,133,.84),rgba(19,16,81,.94));border:1px solid rgba(255,255,255,.10)}.playerBar img{width:58px;height:58px;object-fit:contain;border-radius:17px;background:linear-gradient(145deg,#17156f,#0f0d47)}.playerName{font-size:clamp(15px,3vw,21px);line-height:1}.playerSub{color:#cbd0e7;font-size:clamp(10px,2vw,13px);margin-top:3px}.modeBadge{font-weight:800;font-size:clamp(11px,2vw,14px)}
.boardShell{position:relative;padding:15px;border-radius:34px;background:linear-gradient(180deg,#5c46ff,#3922b4 60%,#281676);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 16px 30px rgba(0,0,0,.28),0 0 22px rgba(113,110,255,.16)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;aspect-ratio:1;background:linear-gradient(180deg,#151767,#101250);border-radius:26px;padding:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.tile,.blank{position:relative;aspect-ratio:1;border-radius:20px;display:grid;place-items:center;user-select:none}.tile{font-family:var(--font-accent);font-weight:900;font-size:clamp(30px,8vw,56px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15);background:linear-gradient(145deg,#20c5ff,#2f75ff);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -8px 14px rgba(0,45,150,.2),0 0 18px rgba(45,180,255,.18);transition:transform .12s ease,filter .12s ease}.tile:nth-child(3n+1){background:linear-gradient(145deg,#6e5cff,#a953ff)}.tile:nth-child(4n){background:linear-gradient(145deg,#ff4db6,#ff6e7b)}.tile.hot{background:linear-gradient(145deg,#ff4db6,#ff6e7b);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 20px rgba(255,70,190,.25)}.tile.movable{cursor:pointer}.tile.movable:hover{filter:brightness(1.12)}.tile.movable:active{transform:scale(.95)}.blank{background:linear-gradient(145deg,rgba(16,19,85,.65),rgba(9,10,52,.65));box-shadow:inset 0 0 0 2px rgba(89,199,255,.25),inset 0 0 24px rgba(50,215,255,.06)}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.controls .ghost{padding:13px 10px;text-align:center;font-weight:900;font-size:clamp(14px,2.6vw,17px);border-radius:22px;background:linear-gradient(145deg,rgba(29,33,120,.92),rgba(17,14,68,.96));border:1px solid rgba(91,143,255,.28)}
.overlay{position:absolute;inset:0;background:rgba(5,2,26,.72);backdrop-filter:blur(7px);display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:40}.overlay.open{display:flex}.sheet{width:min(100%,660px);padding:24px 18px 18px;border-radius:30px;background:linear-gradient(160deg,rgba(14,8,58,.985),rgba(7,4,33,.99));border:1px solid rgba(105,90,255,.28);box-shadow:0 -18px 48px rgba(0,0,0,.42)}.sheet h3{margin:0 0 10px;font-size:clamp(25px,4vw,34px)}.sheet p{margin:0;color:#ced1ec;line-height:1.35}.resultScore{margin-top:10px;font-weight:900;color:#95f5ff}.nameEntry{display:flex;gap:8px;margin-top:14px}.nameEntry input{flex:1;min-width:0;padding:13px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#fff;outline:none}.error{min-height:18px;margin-top:5px;color:#ff9fc8;font-size:12px}.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.recordsList{display:grid;gap:8px;max-height:55vh;overflow:auto;padding-right:4px}.record{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.record small{display:block;color:#c4c6dd}.hide{display:none}
@media(max-width:760px){body{display:block}#app{width:100vw;height:100dvh;max-width:none;aspect-ratio:auto;box-shadow:none}}
@media(max-height:780px){.menuLogo{width:56px;height:56px}.heroOption{height:74px;grid-template-columns:52px 1fr}.heroOption img{width:52px;height:52px}.modeCard{min-height:84px}.boardShell{padding:12px}.board{gap:8px;padding:10px}.tile{border-radius:16px}.controls .ghost{padding:11px 8px}}
</style>

<body data-game="fifteen">
<div id="app"><div class="space"></div>
<section id="splash" class="screen active"><button id="startBtn" class="v12Start" type="button" aria-label="Начать игру">Начать игру</button></section>
<section id="menu" class="screen scroll">
<div class="menuWrap">
<h1 class="menuTitle u"><span class="sr-only">Пятнашки</span><img class="gameTitleArt" src="../../assets/titles/fifteen.png" alt="" aria-hidden="true"></h1><p class="menuSub">Классические «Пятнашки» 4×4 • соберите числа по порядку</p>
<div class="heroPanel"><div class="heroHeader"><strong class="u">Выберите героя</strong><span id="heroNote">Выбран герой: Капитан Корги</span></div><div class="heroRow">
<button class="heroOption on" data-hero="corgi"><img src="../../assets/corgi.png" alt="Капитан Корги"><div class="heroName u">Капитан<br>Корги</div></button>
<button class="heroOption" data-hero="cat"><img src="../../assets/cat.png" alt="Космо-Кот"><div class="heroName u">Космо-<br>Кот</div></button></div></div>

<button class="modeCard timed" data-mode="timed"><span class="modeThumb"><span class="clockIcon"></span><span class="speedLines"></span></span><strong class="u">На время</strong><span class="desc">Соберите поле как можно быстрее</span><span class="modeArrow">›</span></button>
</div><button id="recordsBtn" class="recordsBtn">🏆 Рекорды</button></div></section>

<div class="topbar"><div class="miniLogo"></div><div class="gameTitle"><h2 class="galaxy-title"><span class="sr-only">Пятнашки</span><img class="gameTitleArt" src="../../assets/titles/fifteen.png" alt="" aria-hidden="true"></h2><div id="gameModeText">Классика • 4×4</div></div><button id="soundBtn" class="sound">🔊</button></div>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const HERO={corgi:{name:'Капитан Корги',img:'../../assets/corgi.png'},cat:{name:'Космо-Кот',img:'../../assets/cat.png'}};
const BAD=['fuck','shit','bitch','сука','хер','пизд','еба','нах'];
let selectedHero='corgi',mode='classic',board=[],moves=0,startTime=0,elapsed=0,timerId=null,soundOn=true,playing=false;
function show(id){if(id!=='game')GameLifecycle.begin();['splash','menu','game'].forEach(k=>$('#'+k).classList.toggle('active',k===id))}
function solved(){return [...Array(15)].map((_,i)=>i+1).concat(0)}
function isSolved(){return board.every((v,i)=>v===solved()[i])}
function neighbors(blank){const r=Math.floor(blank/4),c=blank%4,out=[];if(r>0)out.push(blank-4);if(r<3)out.push(blank+4);if(c>0)out.push(blank-1);if(c<3)out.push(blank+1);return out}
function shuffled(){let a=solved(),blank=15,prev=-1;for(let i=0;i<260;i++){let ns=neighbors(blank).filter(x=>x!==prev);let n=ns[Math.floor(Math.random()*ns.length)];[a[blank],a[n]]=[a[n],a[blank]];prev=blank;blank=n}if(a.every((v,i)=>v===solved()[i]))return shuffled();return a}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function records(){try{return JSON.parse(localStorage.getItem('youthFifteenRecords')||'[]')}catch{return []}}
function modeRecords(){return records().filter(r=>r.mode===mode).sort((a,b)=>mode==='timed'?(a.time-b.time||a.moves-b.moves):(a.moves-b.moves||a.time-b.time))}
function updateRecord(){const r=modeRecords()[0];$('#recordLabel').textContent=mode==='timed'?'Лучшее время':'Рекорд ходов';$('#recordValue').textContent=r?(mode==='timed'?fmt(r.time):r.moves):'—'}
function startGame(m=mode){GameLifecycle.begin();mode=m;board=shuffled();moves=0;elapsed=0;startTime=Date.now();playing=true;GameLifecycle.cancel(timerId);timerId=GameLifecycle.repeat(()=>{if(!playing)return;elapsed=(Date.now()-startTime)/1000;$('#timeValue').textContent=fmt(elapsed)},250);$('#movesValue').textContent='0';$('#timeValue').textContent='00:00';$('#gameModeText').textContent=mode==='timed'?'На время • 4×4':'Классика • 4×4';const h=HERO[selectedHero];$('#playerImg').src=h.img;$('#playerName').textContent=h.name;$('#playerSub').textContent=mode==='timed'?'Соберите как можно быстрее':'Соберите 1–15 по порядку';updateRecord();render();show('game');sound('start')}
function render(){const el=$('#board');el.innerHTML='';const blank=board.indexOf(0),mov=new Set(neighbors(blank));board.forEach((v,i)=>{const d=document.createElement(v?'button':'div');d.className=v?'tile'+(v===15?' hot':'')+(mov.has(i)?' movable':''):'blank';if(v){d.textContent=v;d.onclick=()=>moveTile(i)}el.appendChild(d)})}
function moveTile(i){if(!playing)return;const b=board.indexOf(0);if(!neighbors(b).includes(i)){sound('blocked');return}[board[b],board[i]]=[board[i],board[b]];moves++;$('#movesValue').textContent=moves;sound('move');render();if(isSolved())finish()}
function moveBlank(dir){if(!playing)return;const b=board.indexOf(0),r=Math.floor(b/4),c=b%4;let target=-1;if(dir==='left'&&c<3)target=b+1;if(dir==='right'&&c>0)target=b-1;if(dir==='up'&&r<3)target=b+4;if(dir==='down'&&r>0)target=b-4;if(target>=0)moveTile(target)}
function finish(){playing=false;GameLifecycle.cancel(timerId);elapsed=(Date.now()-startTime)/1000;$('#timeValue').textContent=fmt(elapsed);const rs=modeRecords(),qualify=rs.length<10||(mode==='timed'?(elapsed<(rs[rs.length-1]?.time??Infinity)):(moves<(rs[rs.length-1]?.moves??Infinity)));$('#resultText').textContent=mode==='timed'?'Космический пазл собран на скорость.':'Все числа стоят на своих местах.';$('#resultScore').textContent=`${moves} ходов • ${fmt(elapsed)}`;$('#nameEntry').classList.toggle('hide',!qualify);$('#recordName').value='';$('#nameError').textContent='';$('#resultOverlay').classList.add('open');sound('win')}
function saveRecord(name){const arr=records();arr.push({name,mode,moves,time:elapsed,date:Date.now()});arr.sort((a,b)=>{if(a.mode!==b.mode)return a.mode.localeCompare(b.mode);return a.mode==='timed'?(a.time-b.time||a.moves-b.moves):(a.moves-b.moves||a.time-b.time)});const out=[];for(const m of ['classic','timed'])out.push(...arr.filter(r=>r.mode===m).slice(0,10));localStorage.setItem('youthFifteenRecords',JSON.stringify(out));updateRecord()}
function renderRecords(){const box=$('#recordsList'),arr=records();box.innerHTML='';if(!arr.length){box.innerHTML='<div class="record"><div>—</div><div>Пока нет результатов<small>Сыграйте первую партию</small></div><div>—</div></div>';return}const sorted=[...arr].sort((a,b)=>{if(a.mode!==b.mode)return a.mode.localeCompare(b.mode);return a.mode==='timed'?(a.time-b.time||a.moves-b.moves):(a.moves-b.moves||a.time-b.time)});sorted.slice(0,15).forEach((r,i)=>{const row=document.createElement('div');row.className='record';row.innerHTML=`<div>${i+1}</div><div>${esc(r.name)}<small>${r.mode==='timed'?'На время':'Классика'} • ${r.moves} ходов</small></div><div>${fmt(r.time)}</div>`;box.appendChild(row)})}
function clean(s){return s.trim().replace(/\s+/g,' ').slice(0,18)}function badName(s){const t=s.toLowerCase().replace(/[^a-zа-яё0-9]/gi,'');return BAD.some(x=>t.includes(x))}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let actx=null;function sound(kind){if(!soundOn)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime,g=actx.createGain();g.connect(actx.destination);g.gain.setValueAtTime(.055,t);const mk=(f,type,d,at=0)=>{const o=actx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t+at);o.connect(g);o.start(t+at);o.stop(t+at+d)};if(kind==='move'){mk(420,'sine',.06);mk(560,'triangle',.05,.035)}else if(kind==='blocked'){mk(170,'sine',.06)}else if(kind==='win'){mk(520,'triangle',.09);mk(680,'triangle',.09,.09);mk(900,'sine',.16,.18)}else{mk(360,'sine',.07)}g.gain.exponentialRampToValueAtTime(.001,t+.4)}catch(e){}}
$('#startBtn').onclick=()=>show('menu');$$('.heroOption').forEach(b=>b.onclick=()=>{selectedHero=b.dataset.hero;$$('.heroOption').forEach(x=>x.classList.toggle('on',x===b));$('#heroNote').textContent='Выбран герой: '+HERO[selectedHero].name});$$('.modeCard').forEach(b=>b.onclick=()=>startGame(b.dataset.mode));$('#homeBtn').onclick=()=>{playing=false;GameLifecycle.cancel(timerId);show('menu')};$('#newBtn').onclick=()=>startGame(mode);$('#screenBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();$('#soundBtn').onclick=()=>{soundOn=!soundOn;$('#soundBtn').textContent=soundOn?'🔊':'🔇'};$('#resultMenu').onclick=()=>{$('#resultOverlay').classList.remove('open');show('menu')};$('#resultReplay').onclick=()=>{$('#resultOverlay').classList.remove('open');startGame(mode)};$('#saveRecordBtn').onclick=()=>{const n=clean($('#recordName').value);if(n.length<2){$('#nameError').textContent='Введите имя от 2 символов';return}if(badName(n)){ $('#nameError').textContent='Это имя нельзя использовать';return}saveRecord(n);$('#nameError').textContent='Сохранено';$('#nameEntry').classList.add('hide')};$('#recordsBtn').onclick=()=>{renderRecords();$('#recordsOverlay').classList.add('open')};$('#recordsClose').onclick=()=>$('#recordsOverlay').classList.remove('open');window.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',A:'left',D:'right',W:'up',S:'down'};if(map[e.key]&&$('#game').classList.contains('active')){e.preventDefault();moveBlank(map[e.key])}});show('splash');
})();

window.GameLifecycle.engineInitialized=true;
